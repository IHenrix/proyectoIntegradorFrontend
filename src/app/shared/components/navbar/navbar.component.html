<nav class="navbar">
  <div class="nav-inner">

    <!-- Logo -->
    <a routerLink="/" class="logo">
      <span class="logo-icon-wrap">
        <i class="fa-solid fa-plane-departure"></i>
      </span>
      <span class="logo-text">Pasaje<strong>Ya</strong></span>
    </a>

    <!-- Acciones -->
    <div class="nav-actions">

      @if (auth.estaAutenticado()) {

        <!-- Usuario autenticado -->
        <div class="user-pill">
          <div class="avatar" [class]="rolInfo().avatar">
            {{ inicial() }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ auth.nombre() }}</span>
            @if (rolInfo().badge) {
              <span class="role-badge" [class]="rolInfo().css">{{ rolInfo().label }}</span>
            }
          </div>
        </div>

        <a routerLink="/alertas" routerLinkActive="active" class="nav-link">
          <i class="fa-solid fa-bell"></i>
          Alertas
        </a>
        <a routerLink="/dashboard" routerLinkActive="active" class="nav-link">Mi cuenta</a>
        <button class="btn-logout" (click)="auth.cerrarSesion()">Salir</button>

      } @else {

        <a routerLink="/auth" class="btn-login">Iniciar sesión</a>
        <a routerLink="/auth" class="btn-registro">Registrarse →</a>

      }

    </div>
  </div>
</nav>
