<nav class="navbar">
  <div class="nav-inner">

    <!-- Logo -->
    <a routerLink="/" class="logo">
      <span class="logo-icon-wrap">
        <i class="fa-solid fa-plane-departure"></i>
      </span>
      <span class="logo-text">Pasaje<strong>Ya</strong></span>
    </a>

    <!-- Acciones -->
    <div class="nav-actions">

      @if (auth.estaAutenticado()) {

        <!-- Alertas -->
        <a routerLink="/alertas" routerLinkActive="active" class="nav-icon-btn" title="Alertas">
          <i class="fa-solid fa-bell"></i>
          <span>Alertas</span>
        </a>

        <!-- Usuario → perfil -->
        <a routerLink="/perfil" routerLinkActive="active" class="user-pill" title="Ver perfil">
          <div class="avatar" [class]="rolInfo().avatar">
            {{ inicial() }}
          </div>
          <div class="user-info">
            <span class="user-name">{{ auth.nombre() }}</span>
            @if (rolInfo().badge) {
              <span class="role-badge" [class]="rolInfo().css">{{ rolInfo().label }}</span>
            } @else {
              <span class="role-badge badge-free">Free</span>
            }
          </div>
          <i class="fa-solid fa-chevron-right user-arrow"></i>
        </a>

        <!-- Salir -->
        <button class="btn-logout" (click)="auth.cerrarSesion()" title="Cerrar sesión">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>

      } @else {

        <a routerLink="/auth" class="btn-login">Iniciar sesión</a>
        <a routerLink="/auth" class="btn-registro">
          <i class="fa-solid fa-user-plus"></i> Registrarse
        </a>

      }

    </div>
  </div>
</nav>
