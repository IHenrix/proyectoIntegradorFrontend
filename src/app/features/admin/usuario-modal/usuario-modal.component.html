@if (abierto) {
  <div class="um-backdrop" (click)="onCerrar()">
    <div class="um-modal" (click)="$event.stopPropagation()">

      <div class="um-header">
        <h3>{{ esEdicion ? 'Editar usuario' : 'Nuevo usuario' }}</h3>
        <button type="button" class="um-close" (click)="onCerrar()" aria-label="Cerrar">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <form [formGroup]="form" (ngSubmit)="guardar()" class="um-form">

        @if (errorLocal() || errorExterno) {
          <div class="um-error">
            <i class="fa-solid fa-triangle-exclamation"></i>
            {{ errorLocal() || errorExterno }}
          </div>
        }

        <div class="um-row">
          <label class="um-field">
            <span>Nombre *</span>
            <input type="text" formControlName="nombre">
          </label>
          <label class="um-field">
            <span>Apellido paterno *</span>
            <input type="text" formControlName="apellidoPaterno">
          </label>
        </div>

        <div class="um-row">
          <label class="um-field">
            <span>Apellido materno</span>
            <input type="text" formControlName="apellidoMaterno">
          </label>
          <label class="um-field um-field-sm">
            <span>Género</span>
            <select formControlName="genero">
              <option value="">—</option>
              <option value="M">Masculino</option>
              <option value="F">Femenino</option>
              <option value="O">Otro</option>
            </select>
          </label>
        </div>

        <label class="um-field">
          <span>Correo electrónico *</span>
          <input type="email" formControlName="email">
        </label>

        <label class="um-field">
          <span>{{ esEdicion ? 'Nueva contraseña (dejar en blanco para no cambiarla)' : 'Contraseña *' }}</span>
          <input type="password" formControlName="password" autocomplete="new-password">
        </label>

        <div class="um-row">
          <label class="um-field">
            <span>Teléfono</span>
            <input type="tel" formControlName="telefono">
          </label>
          <label class="um-field">
            <span>Fecha de nacimiento</span>
            <input type="date" formControlName="fechaNacimiento">
          </label>
        </div>

        <div class="um-row">
          <label class="um-field um-field-sm">
            <span>Tipo doc.</span>
            <select formControlName="tipoDocumento">
              <option value="">—</option>
              @for (t of TIPOS_DOC; track t.codigo) {
                <option [value]="t.codigo">{{ t.nombre }}</option>
              }
            </select>
          </label>
          <label class="um-field">
            <span>Número de documento</span>
            <input type="text" formControlName="nroDocumento">
          </label>
        </div>

        <div class="um-row">
          <label class="um-field">
            <span>Rol *</span>
            <select formControlName="rol">
              @for (r of ROLES; track r) {
                <option [value]="r">{{ r }}</option>
              }
            </select>
          </label>
          @if (esEdicion) {
            <label class="um-field um-field-checkbox">
              <span>Estado</span>
              <span class="um-checkbox-wrap">
                <input type="checkbox" formControlName="activo">
                <span>Cuenta activa</span>
              </span>
            </label>
          }
        </div>

        <div class="um-actions">
          <button type="button" class="um-btn um-btn-cancel" (click)="onCerrar()">Cancelar</button>
          <button type="submit" class="um-btn um-btn-guardar" [disabled]="guardando">
            @if (guardando) {
              <i class="fa-solid fa-circle-notch fa-spin"></i>
            }
            {{ esEdicion ? 'Guardar cambios' : 'Crear usuario' }}
          </button>
        </div>

      </form>
    </div>
  </div>
}
